name: CI

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Unit and contract tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Real sandboxed Chrome smoke
        run: node --test test/e2e/platform-smoke.test.mjs

      - name: macOS hidden app launcher regression
        if: runner.os == 'macOS'
        run: node --test test/e2e/headless-dock.test.mjs
